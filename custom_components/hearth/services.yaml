set_schedule:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hearth
          domain: climate
          multiple: true
    weekdays:
      required: true
      example: '[{"time": "06:30", "temp": 19}, {"time": "22:30", "temp": 16}]'
      selector:
        object:
    weekends:
      required: true
      example: '[{"time": "07:30", "temp": 19}, {"time": "22:30", "temp": 16}]'
      selector:
        object:
boost:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hearth
          domain: climate
          multiple: true
    minutes:
      selector:
        number:
          min: 5
          max: 720
          unit_of_measurement: min
    temperature:
      selector:
        number:
          min: 5
          max: 28
          step: 0.5
          unit_of_measurement: °C
cancel_boost:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hearth
          domain: climate
          multiple: true
set_holiday:
  fields:
    until:
      example: "2026-12-28 16:00:00"
      selector:
        datetime:
