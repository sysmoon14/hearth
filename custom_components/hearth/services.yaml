set_schedule:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hearth
          domain: climate
          multiple: true
    weekdays:
      required: true
      example: '[{"time": "06:30", "temp": 19}, {"time": "22:30", "temp": 16}]'
      selector:
        object:
    weekends:
      required: true
      example: '[{"time": "07:30", "temp": 19}, {"time": "22:30", "temp": 16}]'
      selector:
        object:
boost:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hearth
          domain: climate
          multiple: true
    minutes:
      selector:
        number:
          min: 5
          max: 720
          unit_of_measurement: min
    temperature:
      selector:
        number:
          min: 5
          max: 28
          step: 0.5
          unit_of_measurement: °C
cancel_boost:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hearth
          domain: climate
          multiple: true
set_holiday:
  fields:
    until:
      example: "2026-12-28 16:00:00"
      selector:
        datetime:
add_warm_up:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hearth
          domain: climate
          multiple: true
    rise:
      required: true
      example: 2.4
      selector:
        number:
          min: 0.5
          max: 15
          step: 0.1
          unit_of_measurement: °C
    minutes:
      required: true
      example: 120
      selector:
        number:
          min: 10
          max: 360
          unit_of_measurement: min
boost_hot_water:
  fields:
    minutes:
      default: 60
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
stop_hot_water:
resume_hot_water:
